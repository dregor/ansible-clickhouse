---
# Откат с yaml-схемы (роль ansible-role-clickhouse): её unit запускает сервер с config.yaml.
# yaml-конфиги удаляются ДО генерации xml: иначе живой сервер на горячей перечитке
# смержит config.d/*.xml со своим yaml (шарды задвоятся). Новый конфиг - рестартом.
- name: Rollback from yaml | Check yaml-scheme systemd unit
  slurp:
    src: /etc/systemd/system/clickhouse-server.service
  register: clickhouse_yaml_unit
  failed_when: false
  become: true

- name: Rollback from yaml | Remove yaml configs and unit
  file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ clickhouse_path_configdir }}/config.yaml"
    - "{{ clickhouse_path_configdir }}/users.yaml"
    - /etc/systemd/system/clickhouse-server.service
  when: "'config.yaml' in (clickhouse_yaml_unit.content | default('') | b64decode)"
  register: clickhouse_yaml_removed
  become: true

- name: Rollback from yaml | Systemd daemon reload
  systemd:
    daemon_reload: true
  when: clickhouse_yaml_removed is changed
  become: true

- name: Check clickhouse config and logs
  file:
    dest: "{{ item }}"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rwx,o-rwx"
    state: directory
  loop:
    - "{{ clickhouse_path_logdir }}"
    - "{{ clickhouse_path_configdir }}"
    - "{{ clickhouse_path_tmp }}"
  become: true

- name: Check clickhouse data directory
  file:
    dest: "{{ clickhouse_path_data }}"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "{{ clickhouse_path_data_mode }}"
    state: directory
  become: true

- name: Config | Create config.d folder
  file:
    path: "{{ clickhouse_path_configdir }}/config.d"
    state: directory
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rwx,o-rwx"
  become: true

- name: Config | Generate system config
  template:
    src: config.j2
    dest: "{{ clickhouse_path_configdir }}/config.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rw,o-rwx"
  become: true

- name: Config | Generate users config
  template:
    src: users.j2
    dest: "{{ clickhouse_path_configdir }}/users.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rw,o-rwx"
  become: true
  tags: clickhouse_users

- name: Config | Generate remote_servers config
  template:
    src: remote_servers.j2
    dest: "{{ clickhouse_path_configdir }}/config.d/clickhouse_remote_servers.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rw,o-rwx"
  become: true
  when: clickhouse_clusters is defined

- name: Config | Generate macros config
  template:
    src: macros.j2
    dest: "{{ clickhouse_path_configdir }}/config.d/macros.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "ug=rw,o-rwx"
  become: true
  when: clickhouse_macros is defined 

- name: Config | Generate zookeeper servers config
  template:
    src: zookeeper-servers.j2
    dest: "{{ clickhouse_path_configdir }}/config.d/zookeeper-servers.xml"
    owner: "{{ clickhouse_user | default('clickhouse') }}"
    group: "{{ clickhouse_group | default('clickhouse') }}"
    mode: "u=rw,og=r"
  become: true
  when: clickhouse_zookeeper_nodes is defined

- name: Config | Fix interserver_http_port and intersever_https_port collision
  lineinfile:
    path: "{{ clickhouse_path_configdir }}/config.xml"
    search_string: '<interserver_http_port>'
    state: absent
  become: true
  when: clickhouse_interserver_https is defined
